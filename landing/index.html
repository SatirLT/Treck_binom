<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Download App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 400px;
    }

    .app-icon {
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.2);
      border-radius: 28px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .download-btn {
      display: inline-block;
      background: #fff;
      color: #764ba2;
      font-size: 18px;
      font-weight: 600;
      padding: 16px 48px;
      border-radius: 50px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .download-btn:active {
      transform: scale(0.97);
    }

    .features {
      margin-top: 40px;
      text-align: left;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .feature-icon {
      font-size: 24px;
      width: 36px;
      text-align: center;
    }

    .feature-text {
      font-size: 15px;
      opacity: 0.95;
    }

    .privacy {
      margin-top: 32px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-icon">
      <span id="appIconEmoji"></span>
    </div>
    <h1 id="appTitle">Get the App</h1>
    <p class="subtitle" id="appSubtitle">Download now and get started</p>

    <a href="#" class="download-btn" id="downloadBtn">
      Download Free
    </a>

    <div class="features" id="features"></div>

    <p class="privacy">
      Free to download. No credit card required.
    </p>
  </div>

  <script src="tracker.js"></script>
</body>
</html>
